name: Update data

on:
  schedule:
    - cron: "0 14 * * *"        # daily, 6–7am Pacific
  workflow_dispatch: {}          # adds a "Run workflow" button for manual refresh
  push:
    paths:                       # editing the registry or pipeline auto-refreshes data
      - "config/sources.yaml"
      - "pipeline/**"
      - ".github/workflows/update-data.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}    # optional, raises BLS limits
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}  # only needed for fred sources
        run: python -m pipeline.run_all

      - name: Commit refreshed data
        run: |
          git config user.name "oakland-pulse-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: scheduled refresh $(date -u +%F)"
          git push
